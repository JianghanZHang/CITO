# ============================
# MPPI Configuration File
# ============================

# MPPI Parameters
# These control the behavior of the Model Predictive Path Integral optimization.
dt: 0.025          # Time step size for simulation (in seconds).
n_samples: 100     # Number of trajectory samples per iteration.
lambda: 0.1      # Temperature parameter for trajectory cost weighting. 
# 1/lambda = 5%-50% of n_samples gives smooth trajectories: https://arxiv.org/html/2312.02328v2#S1
horizon: 16       # Prediction horizon (number of time steps).
n_workers: 8      # Number of parallel workers for optimization.
seed: 42          # Random seed for reproducibility.
beta: 0.7        # Noist filtering parameter for MPPI.

# ============================
# Model Parameters for Contact Dynamics
# ============================
o_solref:
  - 0.02          # Time constant for contact model (stiffness control).
  - 1.0         # Damping ratio for the contact model.

# ============================
# Mujoco sensor data size
# ============================
sensor_data_size: 15

# ============================
# Spline Parameters
# ============================
# noise_type: "gaussian" # Spline interpolation type ("cubic" for cubic splines).
noise_type: "halton" # Spline interpolation type ("cubic" for cubic splines).

sample_type: "cubic" # Spline interpolation type ("cubic" for cubic splines).
n_knots: 2          # Number of control points (knots) in the spline.

# ============================
# Noise Parameters
# ============================
# Noise standard deviations applied to control inputs for exploration.
noise_sigma:
  - 0.1 # Upper joint (finger 0)
  - 0.1  # Middle joint (finger 0)
  - 0.1  # Lower joint (finger 0)
  - 0.1 # Upper joint (finger 120)
  - 0.1  # Middle joint (finger 120)
  - 0.1  # Lower joint (finger 120)
  - 0.1 # Upper joint (finger 240)
  - 0.1  # Middle joint (finger 240)
  - 0.1  # Lower joint (finger 240)


# ============================
# Cost Function Parameters
# ============================

# Diagonal entries of the state cost matrix Q
# Higher values penalize deviations from reference states more heavily.
Q_diag:
  #Position
  - 0 # Upper joint (finger 0)
  - 0 # Middle joint (finger 0)
  - 0 # Lower joint (finger 0)
  - 0 # Upper joint (finger 120)
  - 0 # Middle joint (finger 120)
  - 0 # Lower joint (finger 120)
  - 0 # Upper joint (finger 240)
  - 0 # Middle joint (finger 240)
  - 0 # Lower joint (finger 240)
  #Velocity
  - 0 # Upper joint (finger 0)
  - 0 # Middle joint (finger 0)
  - 0 # Lower joint (finger 0)
  - 0 # Upper joint (finger 120)
  - 0 # Middle joint (finger 120)
  - 0 # Lower joint (finger 120)
  - 0 # Upper joint (finger 240)
  - 0 # Middle joint (finger 240)
  - 0 # Lower joint (finger 240)

  #   #Position
  # - 0 # Upper joint (finger 0)
  # - 0 # Middle joint (finger 0)
  # - 0 # Lower joint (finger 0)
  # - 0 # Upper joint (finger 120)
  # - 0 # Middle joint (finger 120)
  # - 0 # Lower joint (finger 120)
  # - 0 # Upper joint (finger 240)
  # - 0 # Middle joint (finger 240)
  # - 0 # Lower joint (finger 240)
  # #Velocity
  # - 0 # Upper joint (finger 0)
  # - 0 # Middle joint (finger 0)
  # - 0 # Lower joint (finger 0)
  # - 0 # Upper joint (finger 120)
  # - 0 # Middle joint (finger 120)
  # - 0 # Lower joint (finger 120)
  # - 0 # Upper joint (finger 240)
  # - 0 # Middle joint (finger 240)
  # - 0 # Lower joint (finger 240)

# Diagonal entries of an individual cost term for frame position (This need to correspesond to the order in Mujoco's sensor_data)
W_frame_pos:
 - 1000 # distance (finger 0 tip frame)
 - 1000 # distance (finger 120 tip frame)
 - 1000 # distance (finger 240 tip frame)



W_cube_state:
  - 5000 # position

  - 1000 # orientation

W_stability:
  - 50 

W_tips_contact:
  - 0


# Diagonal entries of the control cost matrix R
# Penalizes excessive control effort (torque commands).
R_diag:
  - 50.00 # Upper joint (finger 0)
  - 50.00  # Middle joint (finger 0)
  - 50.00  # Lower joint (finger 0)
  - 50.00 # Upper joint (finger 120)
  - 50.00  # Middle joint (finger 120)
  - 50.00  # Lower joint (finger 120)
  - 50.00 # Upper joint (finger 240)
  - 50.00  # Middle joint (finger 240)
  - 50.00  # Lower joint (finger 240)